name: Deploy Weekwise to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test the published Weekwise app
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          curl --fail --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 5 "$SITE_URL" -o /tmp/weekwise-live.html
          grep -qi '<title>Weekwise' /tmp/weekwise-live.html
          grep -q 'SUPABASE_PUBLISHABLE_KEY' /tmp/weekwise-live.html
          if grep -Eiq 'SUPABASE_SERVICE_ROLE_KEY|service_role_key[[:space:]]*[:=][[:space:]]*["'][^"']+["']' /tmp/weekwise-live.html; then
            echo "Refusing deployment: a possible service-role secret was found in public HTML."
            exit 1
          fi
          echo "Published Weekwise HTML is reachable, identifies itself correctly, and contains no obvious service-role secret."
