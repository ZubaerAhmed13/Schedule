name: Weekwise Supabase function checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check background push Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Weekwise
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Web Push handler
        run: deno check --no-lock supabase/functions/weekwise-push/index.ts
      - name: Type-check Google and Microsoft calendar handler
        run: deno check --no-lock supabase/functions/weekwise-calendar/index.ts
      - name: Type-check disabled-by-default account erasure handler
        run: deno check --no-lock supabase/functions/weekwise-account/index.ts
      - name: Type-check one-time disposable activation checker
        run: deno check --no-lock supabase/functions/weekwise-activation-check/index.ts
      - name: Type-check one-use live cloud and recovery acceptance check
        run: deno check --no-lock supabase/functions/weekwise-backend-check/index.ts
