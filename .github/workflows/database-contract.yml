name: Weekwise PostgreSQL contract tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: weekwise_ci_fixture_only
          POSTGRES_DB: weekwise_contract
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: weekwise_ci_fixture_only
      PGDATABASE: weekwise_contract
    steps:
      - uses: actions/checkout@v4
      - name: Test both deployed and legacy SQL contracts against isolated PostgreSQL
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/weekwise-rpc-hardening.sql
      - name: Test server-only runtime configuration and optional integration schemas
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/weekwise-integration-config.sql
      - name: Test private invitation enforcement and unchanged existing accounts
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/weekwise-invitation.sql
