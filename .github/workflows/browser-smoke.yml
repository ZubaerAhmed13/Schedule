name: Weekwise browser regression tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Weekwise
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned Playwright test runtime
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1 axe-core@4.14.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Pages client
        run: node scripts/build-weekwise.mjs
      - name: Test connected planner views and mobile layout
        env:
          WEEKWISE_TEST_SITE_ROOT: dist
        # Keep browser suites sequential on each CI runner for reproducible resource use.
        run: node --test --test-concurrency=1 tests/browser/weekwise-ui-smoke.test.mjs tests/browser/weekwise-auth.test.mjs tests/browser/weekwise-reminder-settings.test.mjs
      - name: Preserve planning screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekwise-browser-artifacts
          path: |
            test-results/*.png
            test-results/axe-*.json
            test-results/lab-*.json
          if-no-files-found: ignore
